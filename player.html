<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Popup-Free Video Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      height: 100%;
      overflow: hidden;
    }

    #player-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: black;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    #shield {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      background: transparent;
    }
  </style>
</head>
<body>

<div id="player-container">
  <iframe id="player" allowfullscreen loading="eager"></iframe>
  <div id="shield"></div>
</div>

<script>
  const videoURL = new URLSearchParams(location.search).get("video");
  const iframe = document.getElementById("player");

  if (videoURL) {
    iframe.src = decodeURIComponent(videoURL);
  } else {
    alert("⚠️ No video URL provided.");
  }

  const shield = document.getElementById("shield");

  // Remove shield after 5 seconds or first click
  function disableShield() {
    shield.remove();
  }

  shield.addEventListener("click", disableShield);
  setTimeout(disableShield, 5000);
</script>

</body>
</html>
