<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #player-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: black;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    #blocker {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      pointer-events: none;
    }

    .watermark-cover {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 100px;
      height: 30px;
      background-color: black;
    }

    #click-blocker {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: transparent;
      z-index: 10000;
    }

    @media (orientation: portrait) {
      body::before {
        content: "Please rotate your device 📱↪️";
        position: fixed;
        top: 0;
        left: 0;
        background: #000;
        color: #00ffd5;
        width: 100vw;
        height: 100vh;
        font-size: 24px;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 99999;
      }
    }
  </style>
</head>
<body>

  <div id="player-container">
    <iframe id="player" allowfullscreen loading="eager"></iframe>
    <div id="blocker">
      <div class="watermark-cover"></div>
    </div>
    <div id="click-blocker"></div>
  </div>

  <script>
    const videoURL = new URLSearchParams(location.search).get("video");
    const player = document.getElementById("player");

    if (videoURL) {
      player.src = decodeURIComponent(videoURL);
    } else {
      alert("⚠️ No video URL provided.");
    }

    function goFullscreen() {
      const container = document.getElementById("player-container");
      const reqFull = container.requestFullscreen || container.webkitRequestFullscreen || container.msRequestFullscreen || container.mozRequestFullScreen;
      if (reqFull) reqFull.call(container);

      if (screen.orientation?.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
    }

    // First click blocker to avoid iframe popups
    const clickBlocker = document.getElementById("click-blocker");
    clickBlocker.addEventListener("click", () => {
      clickBlocker.remove(); // Absorbs first click to avoid popup
      goFullscreen();
    });

    window.onload = () => {
      // Optional: try auto fullscreen on load
      setTimeout(goFullscreen, 300);
    };
  </script>

</body>
</html>
