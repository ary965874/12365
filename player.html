<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ad-Free Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #player-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: black;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    #blocker {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      pointer-events: none;
    }

    .watermark-cover {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 100px;
      height: 30px;
      background-color: black;
    }
  </style>
</head>
<body>

  <div id="player-container">
    <iframe id="player" allowfullscreen loading="eager"></iframe>
    <div id="blocker">
      <div class="watermark-cover"></div>
    </div>
  </div>

  <script>
    const videoURL = new URLSearchParams(location.search).get("video");
    const player = document.getElementById("player");

    if (videoURL) {
      player.src = decodeURIComponent(videoURL);
    } else {
      alert("⚠️ No video URL provided.");
    }

    // Fullscreen
    function goFullscreen() {
      const container = document.getElementById("player-container");
      const reqFull = container.requestFullscreen || container.webkitRequestFullscreen || container.msRequestFullscreen || container.mozRequestFullScreen;
      if (reqFull) reqFull.call(container);
    }

    // Prevent most popup ads
    function blockPopups(e) {
      e.preventDefault();
      e.stopPropagation();
    }

    function disablePopupHijack() {
      // Remove ability to open new tabs
      window.open = function () {
        console.log("Blocked window.open");
        return null;
      };

      // Block common events used by pop ads
      ['click', 'mousedown', 'mouseup', 'touchstart'].forEach(evt =>
        document.addEventListener(evt, blockPopups, true)
      );
    }

    // Run protections early
    disablePopupHijack();

    // Trigger fullscreen on first interaction
    window.addEventListener("click", () => {
      disablePopupHijack();
      goFullscreen();
    }, { once: true });

    window.onload = () => {
      disablePopupHijack();
      goFullscreen();
    };
  </script>

</body>
</html>
