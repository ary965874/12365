<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ad-Free Player Attempt</title>
  <style>
    body {
      margin: 0;
      background: #000;
      overflow: hidden;
    }
    iframe {
      width: 100vw;
      height: 100vh;
      border: none;
    }
  </style>
</head>
<body>

<iframe id="videoFrame" src="https://mivalyo.com/embed/klkd7771m3ks" allowfullscreen sandbox="allow-scripts allow-same-origin allow-presentation"></iframe>

<script>
  const iframe = document.getElementById('videoFrame');

  iframe.onload = () => {
    try {
      // Wait a bit and then try to simulate click (not guaranteed due to sandbox)
      setTimeout(() => {
        const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;

        const playBtn = iframeDoc.querySelector('.jw-icon-display');
        if (playBtn) {
          playBtn.click();
        }
      }, 2000);
    } catch (err) {
      console.warn("Can't access iframe content due to cross-origin restrictions.");
    }
  };
</script>

</body>
</html>
